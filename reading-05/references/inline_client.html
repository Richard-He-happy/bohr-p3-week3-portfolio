<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root{--ink:#1d2433;--dim:#5b6478;--line:#d9dde7;--paper:#f6f4ee;--card:#ffffff;--accent:#25605c}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font:15px/1.75 -apple-system,"Segoe UI","Noto Sans SC","Microsoft YaHei",sans-serif}
header.bar{position:sticky;top:0;z-index:9;background:#fff;border-bottom:1px solid var(--line);padding:10px 18px}
header.bar h1{margin:0 0 4px;font-size:17px;font-weight:650;letter-spacing:.2px}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--dim);font-size:12px}
.meta b{color:var(--ink);font-weight:600}
.shell{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;max-width:1240px;margin:0 auto;padding:18px}
.doc{background:#fff;border:1px solid var(--line);border-radius:8px;padding:26px 30px;min-height:60vh}
.side{position:sticky;top:78px;align-self:start;max-height:calc(100vh - 96px);overflow:auto}
.side h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:18px 0 8px}
.side h2:first-child{margin-top:0}
.pno{display:inline-block;min-width:64px;margin-right:8px;color:#8a93a6;font:11px/1 ui-monospace,Consolas,monospace}
p.para{margin:0 0 14px;text-align:justify}
h3.head{margin:26px 0 12px;font-size:17px;border-left:4px solid var(--accent);padding-left:10px}
p.para[data-selection="1"]{background:#f2f8f6;border-radius:5px;box-shadow:0 0 0 6px #f2f8f6}
mark.hl{background:#ffe08a;color:inherit;border-radius:3px;padding:0 1px;cursor:pointer}
mark.hl:hover{background:#ffc94a}
article.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:7px;padding:10px 12px;margin:0 0 10px;cursor:pointer;transition:box-shadow .15s}
article.card:hover,article.card.active{box-shadow:0 2px 10px rgba(20,30,40,.14)}
article.card header{font-size:11px;color:var(--dim);margin-bottom:6px;word-break:break-all}
article.card blockquote{margin:0 0 6px;padding:6px 8px;background:#fbfaf6;border-radius:4px;font-size:13px}
article.card p{margin:2px 0;font-size:13px}
article.card p.q{color:#7a4c00}
article.card p.a{color:#164a2c}
article.card footer{font-size:11px;color:#8a93a6;margin-top:5px}
input#filter{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:13px;background:#fff}
table.mini{width:100%;border-collapse:collapse;font-size:12px;background:#fff;border:1px solid var(--line);border-radius:6px}
table.mini td{border-bottom:1px solid #eef0f4;padding:4px 8px}
ul.unc{margin:0;padding-left:18px;font-size:12px;color:#6b3f00}
p.empty{color:var(--dim);font-size:13px}
p.tip{margin-top:16px;font-size:11px;color:#8a93a6;line-height:1.6}
footer.page{max-width:1240px;margin:0 auto;padding:6px 18px 30px;color:#8a93a6;font-size:11px}
@media (max-width:980px){.shell{grid-template-columns:1fr}.side{position:static;max-height:none}}
</style>
</head>
<body>
<header class="bar">
  <h1>{{TITLE}}</h1>
  <div class="meta">{{META}}</div>
</header>
<main class="shell">
  <section class="doc" id="paras" aria-label="document body">{{PARAS}}</section>
  <aside class="side" aria-label="annotations and qa">
    <h2>批注 · {{ANN_COUNT}} 条</h2>
    <input id="filter" type="search" placeholder="按关键词过滤批注与正文段落" autocomplete="off">
    <div id="cards">{{CARDS}}</div>
    <h2>锚点精度分布</h2>
    <table class="mini"><tbody>{{STATS}}</tbody></table>
    <h2>不确定 / 待人工</h2>
    <ul class="unc">{{UNC}}</ul>
    <p class="tip">本页为离线单文件客户端：没有外部脚本、字体或样式依赖；段落 id 与 anchors.json 的 paragraph_id 一一对应，批注高亮由 char 偏移换算到段落内位置。页面数据同时内嵌为 JSON，可直接复核。</p>
  </aside>
</main>
<footer class="page">margin-reader · 静态可编辑产物（生成自一次程序化运行，无需联网）</footer>
<script type="application/json" id="data-anchors">{{ANCHORS}}</script>
<script type="application/json" id="data-annotations">{{ANN}}</script>
<script type="application/json" id="data-qa">{{QA}}</script>
<script type="application/json" id="data-record">{{RECORD_JSON}}</script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var readJSON = function (id) {
    var el = $(id);
    if (!el) { return null; }
    try { return JSON.parse(el.textContent); } catch (e) { return null; }
  };
  var annotations = readJSON("data-annotations") || [];
  var anchors = readJSON("data-anchors") || {};
  var cards = Array.prototype.slice.call(document.querySelectorAll("article.card"));
  var marks = Array.prototype.slice.call(document.querySelectorAll("mark.hl"));

  function focusCard(card) {
    cards.forEach(function (c) { c.classList.remove("active"); });
    card.classList.add("active");
    var target = card.getAttribute("data-target");
    var para = target ? $(target) : null;
    if (para) { para.scrollIntoView({ behavior: "smooth", block: "center" }); }
  }

  cards.forEach(function (card) {
    card.addEventListener("click", function () { focusCard(card); });
    card.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); focusCard(card); }
    });
  });

  marks.forEach(function (mark) {
    mark.addEventListener("click", function () {
      var aid = mark.getAttribute("data-aid");
      cards.forEach(function (card) {
        if (card.textContent.indexOf(aid) >= 0) { focusCard(card); }
      });
    });
  });

  function applyFilter(q) {
    var needle = (q || "").trim().toLowerCase();
    cards.forEach(function (card) {
      card.style.display = !needle || card.textContent.toLowerCase().indexOf(needle) >= 0 ? "" : "none";
    });
    document.querySelectorAll("#paras p.para, #paras h3.head").forEach(function (node) {
      node.style.background = "";
      if (needle && node.textContent.toLowerCase().indexOf(needle) >= 0) {
        node.style.background = "#fff8db";
      }
    });
  }

  var input = $("filter");
  if (input) { input.addEventListener("input", function () { applyFilter(input.value); }); }

  try {
    var key = "margin-reader:last-paragraph";
    var last = window.localStorage.getItem(key);
    if (last && $(last)) {
      $(last).style.outline = "2px dashed #25605c";
    }
    var first = document.querySelector("p.para");
    if (first) {
      first.addEventListener("click", function () {
        try { window.localStorage.setItem(key, first.id); } catch (e) {}
      });
    }
    var record = readJSON("data-record");
    if (record && record.slice) {
      var link = document.createElement("a");
      link.href = "data:text/markdown;charset=utf-8," + encodeURIComponent(record.slice());
      link.download = "reading_record.md";
      link.textContent = "下载阅读记录";
      document.querySelector(".side").appendChild(link);
    }
  } catch (e) { /* localStorage 不可用时静默降级，客户端仍可阅读 */ }

  window.marginReader = { anchors: anchors, annotations: annotations };
})();
</script>
</body>
</html>
